name: FF14 Market Listings Pipeline

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Execution mode (Item count)'
        required: true
        default: 'All'
        type: choice
        options:
          - 'All'
          - '200'
          - '50'
      concurrency:
        description: 'Concurrency (Parallel requests)'
        required: true
        default: '6'
        type: choice
        options:
          - '6'
          - '8'
          - '4'

permissions:
  contents: write

concurrency:
  group: listings-update
  cancel-in-progress: false

jobs:
  run-listings-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Download existing data assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data frontend/public
          gh release download data-latest --repo ${{ github.repository }} --dir data/ --clobber || true
          cp data/*.json.gz frontend/public/ 2>/dev/null || true
          cp data/*.json frontend/public/ 2>/dev/null || true

      - name: Restore / Cache SQLite Database
        uses: actions/cache@v4
        with:
          path: data/ff14_craft.db
          key: ff14-craft-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ff14-craft-db-${{ runner.os }}-

      - name: Run Listings Pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          TEST_MODE="${{ inputs.test_mode || 'All' }}"
          CONCURRENCY="${{ inputs.concurrency || '6' }}"
          echo "=== Starting Listings Pipeline (Items: $TEST_MODE, Concurrency: $CONCURRENCY) ==="
          
          if [ "$TEST_MODE" = "All" ]; then
            python backend/app/pipeline/listings_pipeline.py --concurrency $CONCURRENCY
          else
            python backend/app/pipeline/listings_pipeline.py --sample $TEST_MODE --concurrency $CONCURRENCY
          fi
          echo "=== Listings Pipeline Completed ==="

      - name: Check Generated Data Size
        run: |
          ls -lh frontend/public/listings.json.gz || true

      - name: Upload updated listings to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data-latest --repo ${{ github.repository }} || gh release create data-latest --title "Latest Market Data" --notes "Automated data assets for FF14 Craft Market Checker" --repo ${{ github.repository }}
          gh release upload data-latest \
            frontend/public/listings.json.gz \
            --repo ${{ github.repository }} \
            --clobber
          echo "✨ Successfully uploaded updated listings to Release data-latest!"
